apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive
  namespace: poc-hive
  labels:
    app: hive
    app.kubernetes.io/name: hive
    app.kubernetes.io/part-of: autopoc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hive
  template:
    metadata:
      labels:
        app: hive
        app.kubernetes.io/name: hive
    spec:
      imagePullSecrets:
        - name: quay-pull-secret
      containers:
        - name: hive
          image: quay.io/aicatalyst/hive:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: HIVE_HEALTH_BIND
              value: "0.0.0.0"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
